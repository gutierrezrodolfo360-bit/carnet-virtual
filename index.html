<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carné Virtual — Demo</title>
<!-- Para que, al añadirse a la pantalla de inicio, abra a pantalla completa como una app -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f3fb">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ====== Variables de diseño: cambia aquí colores y tamaños ====== */
  :root {
    --acento: #1f5fd1;        /* color principal (títulos, flecha, pin) */
    --fondo: #f3f3fb;         /* fondo de la pantalla */
    --reloj-bg: #dcdcf7;      /* fondo del recuadro del reloj */
    --nube: #d9daf3;          /* color de las nubes */
    --texto: #3b4150;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Inter", system-ui, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  .app {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    background: var(--fondo);
  }

  /* ====== Barra superior ====== */
  .topbar {
    height: 64px;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 24px;
    border-bottom: 1px solid #e2e2ea;
    background: var(--fondo);
    position: relative;
    z-index: 3;
  }
  .topbar svg { width: 22px; height: 22px; stroke: var(--acento); }
  .topbar h1 {
    font-family: "Bebas Neue", sans-serif;
    font-size: 22px;
    letter-spacing: .5px;
    font-weight: 400;
    color: #222;
  }

  /* ====== Reloj ====== */
  .reloj-wrap { text-align: center; margin-top: 22px; position: relative; z-index: 2; }
  .reloj {
    display: inline-block;
    background: var(--reloj-bg);
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 36px;
    letter-spacing: 1px;
    color: #111;
    font-variant-numeric: tabular-nums;
  }
  .fecha { margin-top: 10px; font-size: 16px; color: #4a4f5c; }

  /* ====== Foto ====== */
  .foto {
    width: 96px;
    height: 134px;
    margin: 36px auto 0;
    border-radius: 48px 48px 48px 48px / 30px 30px 70px 70px;
    background: #fff;
    overflow: hidden;
    position: relative;
    z-index: 2;
    cursor: pointer;
    box-shadow: 0 0 0 1px #e6e6f0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .foto.con-imagen img { display: block; }
  .foto .hint { font-size: 11px; color: #aaa; text-align: center; padding: 6px; }
  .foto.con-imagen .hint { display: none; }
  #inputFoto { display: none; }

  /* ====== Nubes animadas ====== */
  .cielo { position: absolute; left: 0; right: 0; top: 360px; height: 120px; z-index: 1; pointer-events: none; }
  .nube {
    position: absolute;
    width: 46px; height: 14px;
    background: var(--nube);
    border-radius: 14px;
    animation: flotar linear infinite;
  }
  .nube::before, .nube::after {
    content: ""; position: absolute; background: var(--nube); border-radius: 50%;
  }
  .nube::before { width: 20px; height: 20px; left: 8px; top: -10px; }
  .nube::after  { width: 16px; height: 16px; left: 22px; top: -7px; }
  @keyframes flotar {
    from { transform: translateX(-80px) scale(var(--s, 1)); }
    to   { transform: translateX(520px) scale(var(--s, 1)); }
  }

  /* Silueta de ciudad al fondo */
  .ciudad {
    position: absolute; left: 0; right: 0; top: 480px; height: 220px; z-index: 0;
    background:
      linear-gradient(var(--fondo), transparent 30%),
      linear-gradient(90deg, transparent 0 4%, #e6e6f7 4% 12%, transparent 12% 70%, #e6e6f7 70% 78%, transparent 78%);
    opacity: .9;
  }
  .ciudad::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 60%; background: #ececf8;
  }

  /* ====== Tarjeta de datos ====== */
  .tarjeta {
    position: relative;
    z-index: 2;
    margin: 72px 20px 40px;
    background: #fff;
    border-radius: 10px;
    padding: 22px 18px 20px;
    text-align: center;
  }
  .nombre {
    font-family: "Bebas Neue", sans-serif;
    color: var(--acento);
    font-size: 40px;
    line-height: 1.02;
    font-weight: 400;
    margin-bottom: 14px;
    word-break: break-word;
  }
  .etiqueta { font-size: 14px; color: #3d4250; margin-top: 6px; }
  .valor { font-size: 16px; font-weight: 700; color: #3d4250; margin-top: 4px; }
  .carrera { font-size: 16px; font-weight: 600; margin-top: 18px; text-transform: uppercase; color: #3d4250; }
  .campus { font-size: 16px; margin-top: 8px; color: #3d4250; display: flex; justify-content: center; align-items: center; gap: 6px; }
  .campus svg { width: 14px; height: 14px; fill: var(--acento); }

  .aviso { text-align: center; font-size: 11px; color: #9a9db0; padding: 0 20px 24px; position: relative; z-index: 2; }

  /* ====== Botón y panel de colores ====== */
  .btn-color {
    margin-left: auto;
    width: 32px; height: 32px;
    border: none; border-radius: 50%;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .btn-color:active { background: #e6e6f2; }
  .btn-color svg { width: 20px; height: 20px; stroke: #555; }

  .panel-color {
    position: absolute;
    top: 58px; right: 12px;
    z-index: 10;
    width: 230px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,.18);
    padding: 14px;
    display: none;
  }
  .panel-color.abierto { display: block; }
  .panel-color h3 { font-size: 13px; font-weight: 700; margin-bottom: 10px; color: #333; }
  .fila-color {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; padding: 6px 0;
  }
  .fila-color input[type="color"] {
    width: 38px; height: 28px; border: 1px solid #ddd; border-radius: 6px;
    padding: 0; background: none; cursor: pointer;
  }
  .presets { display: flex; gap: 8px; margin: 10px 0 4px; flex-wrap: wrap; }
  .presets button {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 0 0 1px #ccc; cursor: pointer;
  }
  .btn-reset {
    width: 100%; margin-top: 10px; padding: 8px; font-size: 13px;
    border: 1px solid #ddd; border-radius: 8px; background: #f7f7fb; cursor: pointer;
  }

  /* Edición en línea: los textos se pueden editar tocándolos */
  [contenteditable]:focus { outline: 2px dashed #c9c9e6; outline-offset: 2px; border-radius: 4px; }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    <h1 contenteditable="true">CARNÉ VIRTUAL</h1>
    <button class="btn-color" id="btnColor" aria-label="Cambiar colores">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/>
        <path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0 0 22 9.8C22 5.5 17.5 2 12 2z"/>
      </svg>
    </button>
  </header>

  <div class="panel-color" id="panelColor">
    <h3>Colores</h3>
    <div class="fila-color">Principal <input type="color" data-var="--acento"></div>
    <div class="fila-color">Fondo <input type="color" data-var="--fondo"></div>
    <div class="fila-color">Reloj <input type="color" data-var="--reloj-bg"></div>
    <div class="fila-color">Nubes <input type="color" data-var="--nube"></div>
    <div class="presets" id="presets"></div>
    <button class="btn-reset" id="btnReset">Restablecer</button>
  </div>

  <div class="reloj-wrap">
    <div class="reloj" id="reloj">00:00:00</div>
    <div class="fecha" id="fecha"></div>
  </div>

  <label class="foto" id="foto" for="inputFoto" title="Toca para cambiar la foto">
    <img id="imgFoto" alt="Foto">
    <span class="hint">Toca para<br>añadir foto</span>
  </label>
  <input type="file" id="inputFoto" accept="image/*">

  <div class="cielo" id="cielo"></div>
  <div class="ciudad"></div>

  <section class="tarjeta">
    <h2 class="nombre" contenteditable="true">NOMBRE APELLIDO EJEMPLO</h2>
    <p class="etiqueta">Código de alumno:</p>
    <p class="valor" contenteditable="true">0000A000</p>
    <p class="etiqueta">ID:</p>
    <p class="valor" contenteditable="true">X00000000</p>
    <p class="carrera" contenteditable="true">Carrera de ejemplo</p>
    <p class="campus">
      <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      <span contenteditable="true">Campus Demo</span>
    </p>
  </section>

  <p class="aviso">Proyecto académico · Universidad Demo · No válido como identificación</p>
</div>

<script>
  // ====== Reloj en vivo ======
  const dias = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const dos = n => String(n).padStart(2, "0");

  function actualizarReloj() {
    const d = new Date();
    document.getElementById("reloj").textContent =
      `${dos(d.getHours())}:${dos(d.getMinutes())}:${dos(d.getSeconds())}`;
    document.getElementById("fecha").textContent =
      `${dias[d.getDay()]}, ${d.getDate()} ${meses[d.getMonth()]} ${d.getFullYear()}`;
  }
  actualizarReloj();
  setInterval(actualizarReloj, 1000);

  // ====== Nubes: se generan con posición, tamaño y velocidad aleatorios ======
  const cielo = document.getElementById("cielo");
  for (let i = 0; i < 9; i++) {
    const n = document.createElement("div");
    n.className = "nube";
    n.style.top = (Math.random() * 100) + "px";
    n.style.setProperty("--s", (0.6 + Math.random() * 0.9).toFixed(2));
    const dur = 18 + Math.random() * 22;
    n.style.animationDuration = dur + "s";
    n.style.animationDelay = (-Math.random() * dur) + "s"; // empiezan repartidas
    cielo.appendChild(n);
  }

  // ====== Foto: elegir imagen del teléfono y guardarla en el navegador ======
  const foto = document.getElementById("foto");
  const img = document.getElementById("imgFoto");

  function mostrarFoto(src) {
    img.src = src;
    foto.classList.add("con-imagen");
  }

  const guardada = localStorage.getItem("carnet-foto");
  if (guardada) mostrarFoto(guardada);

  document.getElementById("inputFoto").addEventListener("change", e => {
    const archivo = e.target.files[0];
    if (!archivo) return;
    const lector = new FileReader();
    lector.onload = () => {
      mostrarFoto(lector.result);
      try { localStorage.setItem("carnet-foto", lector.result); } catch (_) {}
    };
    lector.readAsDataURL(archivo);
  });

  // ====== Panel de colores personalizados ======
  const raiz = document.documentElement;
  const panel = document.getElementById("panelColor");
  const inputs = panel.querySelectorAll('input[type="color"]');
  const porDefecto = {};
  inputs.forEach(inp => {
    porDefecto[inp.dataset.var] = getComputedStyle(raiz).getPropertyValue(inp.dataset.var).trim();
  });

  function aplicarColores(colores) {
    inputs.forEach(inp => {
      const v = colores[inp.dataset.var] || porDefecto[inp.dataset.var];
      raiz.style.setProperty(inp.dataset.var, v);
      inp.value = v;
    });
    document.querySelector('meta[name="theme-color"]').content = colores["--fondo"] || porDefecto["--fondo"];
  }

  function guardar() {
    const c = {};
    inputs.forEach(inp => c[inp.dataset.var] = inp.value);
    localStorage.setItem("carnet-colores", JSON.stringify(c));
  }

  aplicarColores(JSON.parse(localStorage.getItem("carnet-colores") || "{}"));

  inputs.forEach(inp => inp.addEventListener("input", () => {
    raiz.style.setProperty(inp.dataset.var, inp.value);
    if (inp.dataset.var === "--fondo") document.querySelector('meta[name="theme-color"]').content = inp.value;
    guardar();
  }));

  // Combinaciones rápidas: [principal, fondo, reloj, nubes]
  const combinaciones = [
    ["#1f5fd1", "#f3f3fb", "#dcdcf7", "#d9daf3"],
    ["#d4145a", "#fbf3f6", "#f6d9e4", "#f1d6e0"],
    ["#0f8a5f", "#f1f8f4", "#d3eee0", "#d2eadc"],
    ["#e07a00", "#fbf6ef", "#f6e3cb", "#f0e0cc"],
    ["#6b3fd4", "#f5f2fc", "#e2d9f7", "#ddd5f2"],
    ["#222222", "#f2f2f2", "#dddddd", "#d9d9d9"],
  ];
  const cont = document.getElementById("presets");
  combinaciones.forEach(([a, f, r, n]) => {
    const b = document.createElement("button");
    b.style.background = a;
    b.setAttribute("aria-label", "Combinación " + a);
    b.addEventListener("click", () => {
      aplicarColores({ "--acento": a, "--fondo": f, "--reloj-bg": r, "--nube": n });
      guardar();
    });
    cont.appendChild(b);
  });

  document.getElementById("btnReset").addEventListener("click", () => {
    localStorage.removeItem("carnet-colores");
    aplicarColores({});
  });

  // Abrir / cerrar el panel
  document.getElementById("btnColor").addEventListener("click", e => {
    e.stopPropagation();
    panel.classList.toggle("abierto");
  });
  document.addEventListener("click", e => {
    if (!panel.contains(e.target)) panel.classList.remove("abierto");
  });
</script>
</body>
</html>
